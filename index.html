<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a26">
<title>FishCast — прогноз активности рыбы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="brand">FishCast</div>
  <label class="species">
    <span>Вид</span>
    <select id="species"></select>
  </label>
</header>

<div id="map" role="application" aria-label="Карта: тапни, чтобы поставить точку"></div>

<div class="point-row">
  <span id="point-label">Точка не выбрана</span>
  <button id="locate" type="button">Где я</button>
</div>

<section id="status" class="status" hidden></section>

<section id="forecast" hidden>
  <nav class="days" id="days" aria-label="Дни"></nav>

  <div class="day-head">
    <div class="day-title" id="day-title"></div>
    <div class="day-meta" id="day-meta"></div>
  </div>

  <div class="ban" id="ban" hidden></div>

  <div class="windows" id="windows"></div>

  <div class="bars" id="bars" role="list"></div>
  <div class="bars-axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>

  <div class="hour-head">
    <div class="hour-time" id="hour-time"></div>
    <div class="hour-score" id="hour-score"></div>
  </div>
  <div class="hour-weather" id="hour-weather"></div>
  <ul class="factors" id="factors"></ul>
</section>

<footer class="foot">
  Оценка — вероятность активности, не гарантия клёва. Погода: Open-Meteo. Луна: SunCalc.
  Модель <span id="cfg-version"></span>.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
<script src="js/config.js"></script>
<script src="js/weather.js"></script>
<script src="js/solunar.js"></script>
<script src="js/scoring.js"></script>
<script src="js/app.js"></script>
</body>
</html>
