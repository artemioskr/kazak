# Публикация веб-версии на GitHub Pages (ветка gh-pages).
# В сайт попадают только файлы приложения (index.html, css, js) — доки и tools не публикуются.
# Через API (actions/deploy-pages) не работает: GITHUB_TOKEN не может создать Pages-сайт,
# поэтому деплой — принудительным пушем собранной статики в gh-pages.
name: pages

on:
  push:
    branches: [claude/scoring-weights-adjustment-in3e1x, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт (только файлы приложения)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/
          touch _site/.nojekyll
      - name: Опубликовать в gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
