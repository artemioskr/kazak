# Разведка источников уровня воды (одноразовый, запуск руками).
# Раунд 4: полный текст страницы Нижнекамского вдхр на tatarmeteo — под парсер.
name: hydro-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Текст страницы Нижнекамского вдхр
        run: |
          curl -skL -m 30 -A "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0" \
            -o page.html "https://www.tatarmeteo.ru/ru/gidrologiya/dannyie-po-nizhnekamskomu-vodoxranilishhu.html"
          echo "bytes: $(wc -c < page.html)"
          # включаем таблицы: показываем маркеры ячеек, чтобы восстановить структуру
          python3 - <<'PY'
          import re
          h = open('page.html', encoding='utf-8', errors='replace').read()
          # вырезать скрипты/стили
          h = re.sub(r'(?s)<(script|style)[^>]*>.*?</\1>', ' ', h)
          # маркеры структуры таблиц
          h = re.sub(r'(?i)<tr[^>]*>', '\n[TR] ', h)
          h = re.sub(r'(?i)</t[dh]>', ' | ', h)
          h = re.sub(r'(?i)<h(\d)[^>]*>', '\n[H] ', h)
          txt = re.sub(r'<[^>]+>', ' ', h)
          txt = re.sub(r'[ \t]+', ' ', txt)
          lines = [l.strip() for l in txt.splitlines() if l.strip()]
          # с начала содержательной части
          for l in lines:
              print(l[:400])
          PY
