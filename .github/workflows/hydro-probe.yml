# Разведка источников уровня воды (одноразовый, запуск руками).
# Раунд 3: voda.gov.ru и tatarmeteo живы с раннера — смотрим сами страницы данных.
name: hydro-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать и показать структуру
        run: |
          probe() {
            echo "===================== $1"
            rm -f page.html
            code=$(curl -skL -m 30 -A "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0" -o page.html -w "%{http_code}" "$1" || echo FAIL)
            echo "HTTP $code, bytes: $(wc -c < page.html 2>/dev/null || echo 0)"
            [ -s page.html ] || return 0
            # контекст: гидро-термины
            tr '<' '\n' < page.html | grep -iE 'нижнекамск|бьеф|приток|сброс|уровень воды|водохранилищ' | sed 's/^[a-zA-Z0-9 ="/_-]*>//' | head -60
            echo "--- ссылки на бюллетени/обстановку:"
            grep -oiE 'href="[^"]*"[^>]*>[^<]{0,60}(гидролог|уровен|обстановк|бюллетен|водохранилищ)[^<]{0,40}' page.html | head -15
            grep -oE 'href="[^"]*(gidro|hydro|uroven|obstanovk|bulleten|vdhr|reservoir)[^"]*"' page.html | sort -u | head -15
          }
          probe "https://voda.gov.ru/activities/svedeniya-o-rezhimakh-raboty-krupneyshikh-vodokhranilishch-i-ikh-kaskadov/"
          probe "https://www.tatarmeteo.ru/ru/gidrologiya/dannyie-po-kujbyishevskomu-vodoxranilishhu.html"
          probe "https://www.tatarmeteo.ru/ru/gidrologiya/"
