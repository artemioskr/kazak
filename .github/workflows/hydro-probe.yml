# Разведка источников уровня воды (одноразовый, запуск руками).
# Раунд 5: таблица на tatarmeteo пуста в HTML — ищем iframe/AJAX-эндпоинт данных.
name: hydro-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Найти источник данных таблицы
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0"
          curl -skL -m 30 -A "$UA" -o page.html \
            "https://www.tatarmeteo.ru/ru/gidrologiya/dannyie-po-nizhnekamskomu-vodoxranilishhu.html"
          echo "== iframe / script src / все URL в странице:"
          grep -oiE '<iframe[^>]*>' page.html || true
          grep -oiE '<script[^>]*src="[^"]*"' page.html || true
          grep -oE '(https?:)?//[a-zA-Z0-9./_-]+' page.html | sort -u | grep -viE 'w3.org|fonts|jquery|bootstrap|yandex|google|vk.com|schema' | head -30
          grep -oE '"[^"]*\.(php|json|xml|csv)[^"]*"' page.html | sort -u | head -20
          echo "== inline-скрипты (без библиотек):"
          python3 - <<'PY'
          import re
          h = open('page.html', encoding='utf-8', errors='replace').read()
          for m in re.finditer(r'(?s)<script(?![^>]*src)[^>]*>(.*?)</script>', h):
              s = m.group(1).strip()
              if s and len(s) < 3000:
                  print('---'); print(s[:1500])
          PY
