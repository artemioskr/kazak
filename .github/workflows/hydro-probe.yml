# Разведка источников уровня воды (одноразовый, запуск руками).
# Раунд 6: Татэнерго (владелец Нижнекамской ГЭС) и список «Указаний» Росводресурсов.
name: hydro-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Татэнерго и Росводресурсы
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0"
          probe() {
            echo "===================== $1"
            rm -f page.html
            code=$(curl -skL -m 30 -A "$UA" -o page.html -w "%{http_code}" "$1" || echo FAIL)
            echo "HTTP $code, bytes: $(wc -c < page.html 2>/dev/null || echo 0)"
            [ -s page.html ] || return 0
            tr '<' '\n' < page.html | grep -iE 'нижнекамск|бьеф|приток|сброс|уровен|гидролог' | sed 's/^[a-zA-Z0-9 ="/_.:-]*>//' | head -40
            echo "--- ссылки:"
            grep -oiE 'href="[^"]*(gidro|hydro|ges|воды|rezhim|ukazani)[^"]*"' page.html | sort -u | head -20
          }
          probe "https://www.tatgencom.ru/"
          probe "https://tatgencom.ru/activity/gidrologicheskiy-rezhim/"
          probe "https://www.tatgencom.ru/upload/"
          probe "https://voda.gov.ru/activities/svedeniya-o-rezhimakh-raboty-krupneyshikh-vodokhranilishch-i-ikh-kaskadov/ukazaniya-o-rezhimakh-raboty-gidrouzlov-vodokhranilishch-volzhsko-kamskogo-kaskada/"
